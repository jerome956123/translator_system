<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多國語言口譯系統 (進階完整版)</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>window.React || document.write('<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"><\/script>')</script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script>window.ReactDOM || document.write('<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"><\/script>')</script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .mic-wave { display: inline-block; position: relative; }
        .mic-wave::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 100%; height: 100%; border-radius: 50%;
            background-color: rgba(59, 130, 246, 0.5);
            transform: translate(-50%, -50%) scale(1);
            animation: wave 1.5s infinite; z-index: -1;

        @keyframes wave {

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }

</head>
<body>
    <div id="root">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#cbd5e1;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <div>
                <div style="font-size:42px;margin-bottom:12px;">⏳</div>
                <div style="font-size:18px;font-weight:700;margin-bottom:8px;color:white;">正在載入口譯系統...</div>
                <div style="font-size:13px;line-height:1.7;color:#94a3b8;max-width:360px;">如果一直停在這裡，通常是 React CDN 沒有載入或瀏覽器封鎖外部腳本。請開啟 F12 → Console 查看第一個紅色錯誤。</div>
            </div>
        </div>
    </div>

    <script>
        // 已由 JSX 預先轉譯為 JavaScript，避免 GitHub Pages 上因 Babel CDN 載入失敗而空白。
        window.addEventListener('error', function(event) {
            try {
                var rootEl = document.getElementById('root');
                if (rootEl && !rootEl.dataset.rendered) {
                    rootEl.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fecaca;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:left;"><div style="max-width:760px;background:#1e293b;border:1px solid #ef4444;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);"><div style="font-size:22px;font-weight:800;color:white;margin-bottom:10px;">網頁 JavaScript 啟動失敗</div><div style="font-size:14px;line-height:1.8;color:#fecaca;">請打開 F12 → Console，查看第一個紅色錯誤。常見原因是 React CDN 被擋、瀏覽器快取、或 localStorage 權限異常。</div><pre style="white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#fca5a5;border-radius:10px;padding:12px;margin-top:12px;font-size:12px;">' + String(event.message || 'Unknown error').replace(/</g, '&lt;') + '</pre></div></div>';
                }
            } catch (e) {}
        });
const { useState, useEffect, useRef } = React;
// localStorage 安全包裝：避免瀏覽器隱私模式或權限問題導致整個 React 渲染失敗。
const safeStorage = {
    getItem(key) { try {
        return window.localStorage.getItem(key);
    }
    catch (error) {
        console.warn('localStorage getItem failed', error);
        return null;
    } },
    setItem(key, value) { try {
        window.localStorage.setItem(key, value);
    }
    catch (error) {
        console.warn('localStorage setItem failed', error);
    } },
    removeItem(key) { try {
        window.localStorage.removeItem(key);
    }
    catch (error) {
        console.warn('localStorage removeItem failed', error);
    } }
};
// 模型分流：即時字幕用快速文字模型；錄音/匯入音檔保留原本較強的音訊模型
const AUDIO_MODEL_NAME = "gemini-3-flash-preview";
const FAST_TEXT_MODEL_NAME = "gemini-3.1-flash-lite";
const FAST_TEXT_FALLBACK_MODEL_NAME = "gemini-2.5-flash-lite";
const MODEL_NAME = AUDIO_MODEL_NAME;
const LIVE_DRAFT_INTERVAL_MS = 650;
const LIVE_FINALIZE_SILENCE_MS = 1300;
const STREAM_RESTART_DELAY_MS = 350;
const STREAM_WATCHDOG_INTERVAL_MS = 3000;
const STREAM_STALL_MS = 9000;
const AI_STREAM_CHUNK_MS = 6500;
const AI_STREAM_RESTART_GAP_MS = 120;
const AI_STREAM_CONTEXT_CHARS = 260;
const CHINESE_STT_LANG = 'zh-TW';
const SUPPORTED_LANGUAGES = {
    ja: { name: "日本語", promptName: "Japanese", sttLang: "ja-JP", ttsLang: "ja-JP", instruction: "長押しで話す" },
    en: { name: "English", promptName: "English", sttLang: "en-US", ttsLang: "en-US", instruction: "Hold to speak" },
    ko: { name: "한국어", promptName: "Korean", sttLang: "ko-KR", ttsLang: "ko-KR", instruction: "길게 눌러 말하기" },
    de: { name: "Deutsch", promptName: "German", sttLang: "de-DE", ttsLang: "de-DE", instruction: "Zum Sprechen halten" },
    fr: { name: "Français", promptName: "French", sttLang: "fr-FR", ttsLang: "fr-FR", instruction: "Maintenez pour parler" }
};
function App() {
    const [apiKey, setApiKey] = useState(safeStorage.getItem('gemini_api_key') || '');
    const [inputKey, setInputKey] = useState('');
    const [isConfigured, setIsConfigured] = useState(!!safeStorage.getItem('gemini_api_key'));
    const [targetLang, setTargetLang] = useState('ja');
    const [autoSaveAudio, setAutoSaveAudio] = useState(false);
    const autoSaveAudioRef = useRef(autoSaveAudio);
    useEffect(() => {
        autoSaveAudioRef.current = autoSaveAudio;
    }, [autoSaveAudio]);
    // 自動朗讀譯文：預設開啟，並記住使用者上次設定
    const [autoPlayTranslation, setAutoPlayTranslation] = useState(() => safeStorage.getItem('auto_play_translation') !== 'false');
    const autoPlayTranslationRef = useRef(autoPlayTranslation);
    useEffect(() => {
        autoPlayTranslationRef.current = autoPlayTranslation;
        safeStorage.setItem('auto_play_translation', autoPlayTranslation ? 'true' : 'false');
    }, [autoPlayTranslation]);
    const saveApiKey = () => {
        if (inputKey.trim()) {
            safeStorage.setItem('gemini_api_key', inputKey.trim());
            setApiKey(inputKey.trim());
            setIsConfigured(true);
        }
        else {
            alert("請輸入有效的 API Key");
        }
    };
    const resetApiKey = () => {
        if (confirm("確定要清除記憶的 API Key 嗎？")) {
            safeStorage.removeItem('gemini_api_key');
            setApiKey('');
            setInputKey('');
            setIsConfigured(false);
        }
    };
    const [messages, setMessages] = useState([]);
    const [appMode, setAppMode] = useState('record');
    const [isPushToTalk, setIsPushToTalk] = useState(false);
    const [isListening, setIsListening] = useState(false);
    const [isRecording, setIsRecording] = useState(false);
    const [speakingId, setSpeakingId] = useState(null);
    const [activeMode, setActiveMode] = useState(null);
    const [interimText, setInterimText] = useState("");
    const [liveDraftTranslation, setLiveDraftTranslation] = useState("");
    const [liveDraftLoading, setLiveDraftLoading] = useState(false);
    const [voices, setVoices] = useState([]);
    const [autoSegmentMode, setAutoSegmentMode] = useState(() => {
        const savedMode = safeStorage.getItem('auto_segment_mode');
        return ['1', '5', '15'].includes(savedMode) ? savedMode : 'off';
    });
    const [segmentEndsAt, setSegmentEndsAt] = useState(null);
    const [nowTick, setNowTick] = useState(Date.now());
    const recognitionRef = useRef(null);
    const mediaRecorderRef = useRef(null);
    const messagesEndRef = useRef(null);
    const backupTranscriptRef = useRef("");
    const backupInterimTranscriptRef = useRef("");
    const ttsPauseRef = useRef(false);
    const ttsSessionRef = useRef(0);
    const activeModeRef = useRef(null);
    const appModeRef = useRef(appMode);
    const isListeningRef = useRef(isListening);
    const isPushToTalkRef = useRef(isPushToTalk);
    const liveDraftTimerRef = useRef(null);
    const liveDraftSeqRef = useRef(0);
    const liveDraftInFlightRef = useRef(false);
    const liveDraftPendingRef = useRef(null);
    const liveDraftLastStartedAtRef = useRef(0);
    const liveDraftTextRef = useRef("");
    const liveFinalTranscriptRef = useRef("");
    const liveFinalizeTimerRef = useRef(null);
    const streamRestartTimerRef = useRef(null);
    const streamWatchdogTimerRef = useRef(null);
    const streamLastActivityAtRef = useRef(0);
    const aiStreamRef = useRef({ stream: null, recorder: null, chunks: [], mode: null, mimeType: 'audio/webm', segmentIndex: 0 });
    const aiStreamRunningRef = useRef(false);
    const aiStreamSegmentTimerRef = useRef(null);
    const aiStreamRestartTimerRef = useRef(null);
    const aiStreamQueueRef = useRef([]);
    const aiStreamProcessingRef = useRef(false);
    const aiStreamContextRef = useRef('');
    const autoSegmentModeRef = useRef(autoSegmentMode);
    const autoSegmentTimerRef = useRef(null);
    const autoSegmentContinueRef = useRef(false);
    const fileInputRef = useRef(null);
    const uploadSenderRef = useRef('user');
    useEffect(() => { activeModeRef.current = activeMode; }, [activeMode]);
    useEffect(() => { appModeRef.current = appMode; }, [appMode]);
    useEffect(() => { isListeningRef.current = isListening; }, [isListening]);
    useEffect(() => { isPushToTalkRef.current = isPushToTalk; }, [isPushToTalk]);
    useEffect(() => {
        autoSegmentModeRef.current = autoSegmentMode;
        safeStorage.setItem('auto_segment_mode', autoSegmentMode);
        if (autoSegmentMode === 'off') {
            clearAutoSegmentTimer();
        }
        else if (appModeRef.current === 'record' && activeModeRef.current && mediaRecorderRef.current?.state === 'recording') {
            scheduleAutoSegment(activeModeRef.current);
        }
    }, [autoSegmentMode]);
    useEffect(() => {
        const timer = setInterval(() => setNowTick(Date.now()), 1000);
        return () => clearInterval(timer);
    }, []);
    useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
    }, [messages, interimText, liveDraftTranslation]);
    useEffect(() => {
        if (!('speechSynthesis' in window))
            return;
        const loadVoices = () => {
            const availableVoices = window.speechSynthesis.getVoices();
            if (availableVoices.length > 0)
                setVoices(availableVoices);
        };
        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
    }, []);
    const getTtsLangForSender = (sender) => {
        return sender === 'me' ? SUPPORTED_LANGUAGES[targetLang].ttsLang : 'zh-TW';
    };
    const isSpeakableTranslation = (text) => {
        if (!text || typeof text !== 'string')
            return false;
        const trimmed = text.trim();
        if (!trimmed)
            return false;
        const blockedKeywords = ['翻譯失敗', '連線錯誤', '網路連線', '請檢查', '音訊處理失敗', '匯入音檔解析失敗', '欄位空白', '毫無回應', '無清楚語音'];
        return !trimmed.startsWith('[') && !blockedKeywords.some(keyword => trimmed.includes(keyword));
    };
    const getPreferredVoice = (lang) => {
        if (!lang || voices.length === 0)
            return null;
        const normalizedLang = lang.toLowerCase();
        const langRoot = normalizedLang.split('-')[0];
        const matchingVoices = voices.filter(v => {
            const voiceLang = (v.lang || '').toLowerCase();
            return voiceLang === normalizedLang || voiceLang.startsWith(langRoot);
        });
        if (matchingVoices.length === 0)
            return null;
        const isChinese = normalizedLang.startsWith('zh');
        const taiwanFirst = isChinese
            ? matchingVoices.filter(v => {
                const voiceLang = (v.lang || '').toLowerCase();
                return voiceLang.includes('tw') || voiceLang.includes('hant') || voiceLang.includes('cmn-hant');
            })
            : matchingVoices;
        const pool = taiwanFirst.length > 0 ? taiwanFirst : matchingVoices;
        const preferredKeywords = isChinese
            ? ['google', 'microsoft hsiaochen', 'microsoft hanhan', 'microsoft yunjhe', 'microsoft tracy', 'mei-jia', 'mei jia', 'ting-ting', 'sinji', 'natural', 'neural']
            : ['google', 'microsoft', 'natural', 'neural', 'enhanced', 'premium'];
        for (const keyword of preferredKeywords) {
            const found = pool.find(v => (v.name || '').toLowerCase().includes(keyword));
            if (found)
                return found;
        }
        return pool[0] || matchingVoices[0];
    };
    const speakText = (text, lang, id, options = {}) => {
        if (!('speechSynthesis' in window) || !text)
            return;
        const { pauseRecognition = false, resumeMode = null } = options;
        const shouldPauseRecognition = pauseRecognition && recognitionRef.current && appModeRef.current === 'stream';
        if (shouldPauseRecognition) {
            ttsPauseRef.current = true;
            try {
                recognitionRef.current.stop();
            }
            catch (e) {
                console.warn('暫停語音辨識失敗', e);
            }
        }
        const currentTtsSession = ttsSessionRef.current + 1;
        ttsSessionRef.current = currentTtsSession;
        window.speechSynthesis.cancel();
        setSpeakingId(null);
        let ttsWatchdogTimer = null;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = lang && lang.startsWith('zh') ? 0.92 : 1.0;
        utterance.pitch = lang && lang.startsWith('zh') ? 1.05 : 1.0;
        if (voices.length > 0) {
            const targetVoice = getPreferredVoice(lang);
            if (targetVoice)
                utterance.voice = targetVoice;
        }
        const finishSpeaking = () => {
            if (currentTtsSession !== ttsSessionRef.current)
                return;
            if (ttsWatchdogTimer) {
                clearTimeout(ttsWatchdogTimer);
                ttsWatchdogTimer = null;
            }
            setSpeakingId(null);
            if (shouldPauseRecognition) {
                setTimeout(() => {
                    ttsPauseRef.current = false;
                    const modeToResume = resumeMode || activeModeRef.current;
                    if (modeToResume && appModeRef.current === 'stream' && isListeningRef.current && !isPushToTalkRef.current) {
                        scheduleStreamRestart(modeToResume, 180, true);
                    }
                }, 180);
            }
        };
        utterance.onstart = () => setSpeakingId(id);
        utterance.onend = finishSpeaking;
        utterance.onerror = finishSpeaking;
        if (shouldPauseRecognition) {
            const estimatedTtsMs = Math.min(18000, Math.max(3500, String(text).length * (lang && lang.startsWith('zh') ? 115 : 95)));
            // 某些瀏覽器偶爾不觸發 speechSynthesis.onend，會造成即時聆聽卡住；這裡強制保險恢復。
            ttsWatchdogTimer = setTimeout(finishSpeaking, estimatedTtsMs);
        }
        try {
            window.speechSynthesis.speak(utterance);
        }
        catch (e) {
            console.warn('朗讀失敗', e);
            finishSpeaking();
        }
    };
    const autoSpeakTranslation = (translation, sender, id, sourceMode = null) => {
        if (!autoPlayTranslationRef.current || !isSpeakableTranslation(translation))
            return;
        // AI即時模式會持續錄音；若自動朗讀，喇叭聲很容易被下一段音訊收進去造成自我翻譯循環。
        // 因此連續 AI 即時錄音中先不自動朗讀，仍可在訊息完成後手動點喇叭播放。
        if (sourceMode === 'aiStream' && aiStreamRunningRef.current)
            return;
        if (sourceMode === 'record' && autoSegmentModeRef.current !== 'off' && mediaRecorderRef.current?.state === 'recording')
            return;
        const ttsLang = getTtsLangForSender(sender);
        const pauseRecognition = appModeRef.current === 'stream' && recognitionRef.current && activeModeRef.current && !isPushToTalkRef.current;
        setTimeout(() => {
            speakText(translation, ttsLang, id, { pauseRecognition, resumeMode: sourceMode });
        }, 250);
    };
    const blobToBase64 = (blob) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
                if (typeof reader.result === 'string')
                    resolve(reader.result.split(',')[1]);
                else
                    reject(new Error("Failed to convert blob to base64"));
            };
            reader.readAsDataURL(blob);
        });
    };
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    const normalizeTranscriptForFallback = (value = '') => {
        return String(value || '')
            .replace(/\u3000/g, ' ')
            .replace(/\s+/g, ' ')
            .replace(/^[\s。！？!?.,，、；;：:「」『』"'()（）【】\[\]{}]+|[\s。！？!?.,，、；;：:「」『』"'()（）【】\[\]{}]+$/g, '')
            .trim();
    };
    const countCjkKanaHangul = (value = '') => {
        return (String(value).match(/[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]/g) || []).length;
    };
    const countLatinWords = (value = '') => {
        return (String(value).match(/[A-Za-zÀ-ÿ0-9]+/g) || []).length;
    };
    const isReliableBackupTranscript = (text, mode) => {
        const cleaned = normalizeTranscriptForFallback(text);
        if (!cleaned)
            return false;
        const compact = cleaned.replace(/[\s。！？!?.,，、；;：:「」『』"'()（）【】\[\]{}]/g, '');
        const fillerOnly = /^(嗯+|呃+|啊+|喔+|哦+|好+|是+|はい+|え+|あ+|うん+|はいはい+|yes|yeah|ok|okay)$/i.test(compact);
        if (fillerOnly)
            return false;
        const cjkCount = countCjkKanaHangul(cleaned);
        const latinWordCount = countLatinWords(cleaned);
        const nonSpaceLength = cleaned.replace(/\s/g, '').length;
        // 備援翻譯只使用穩定 final transcript。太短的辨識很容易是雜音或尚未完成的片段，避免亂翻。
        if (mode === 'user' || ['ja', 'ko'].includes(targetLang)) {
            return cjkCount >= 5 || nonSpaceLength >= 8 || latinWordCount >= 3;
        }
        return latinWordCount >= 3 || nonSpaceLength >= 10 || cjkCount >= 5;
    };
    const getStableBackupTranscript = (mode) => {
        const finalText = normalizeTranscriptForFallback(backupTranscriptRef.current);
        if (isReliableBackupTranscript(finalText, mode))
            return { text: finalText, source: 'final' };
        return { text: '', source: '' };
    };
    const getStableBackupTranscriptFromSnapshot = (text, mode) => {
        const finalText = normalizeTranscriptForFallback(text);
        if (isReliableBackupTranscript(finalText, mode))
            return { text: finalText, source: 'final' };
        return { text: '', source: '' };
    };
    const isGeminiAudioResultUnusable = (result = {}) => {
        const original = String(result.original || '');
        const translation = String(result.translation || '');
        return !original.trim() ||
            original === '[原文欄位空白]' ||
            original.includes('無法辨識') ||
            original.includes('音檔解析失敗') ||
            original.includes('無清楚語音') ||
            translation.includes('無清楚語音') ||
            translation.includes('音訊處理失敗') ||
            translation.includes('音檔格式解析失敗') ||
            translation.includes('請檢查網路');
    };
    const pad2 = (value) => String(value).padStart(2, '0');
    const clearAutoSegmentTimer = () => {
        if (autoSegmentTimerRef.current) {
            clearTimeout(autoSegmentTimerRef.current);
            autoSegmentTimerRef.current = null;
        }
        setSegmentEndsAt(null);
    };
    const getAutoSegmentMs = () => {
        if (autoSegmentModeRef.current === '1')
            return 60 * 1000;
        if (autoSegmentModeRef.current === '5')
            return 5 * 60 * 1000;
        if (autoSegmentModeRef.current === '15')
            return 15 * 60 * 1000;
        return 0;
    };
    const getSegmentLabel = () => {
        if (autoSegmentMode === '1')
            return '1分鐘';
        if (autoSegmentMode === '5')
            return '5分鐘';
        if (autoSegmentMode === '15')
            return '15分鐘';
        return '關';
    };
    const scheduleAutoSegment = (mode) => {
        clearAutoSegmentTimer();
        const duration = getAutoSegmentMs();
        if (!duration || appModeRef.current !== 'record')
            return;
        const endsAt = Date.now() + duration;
        setSegmentEndsAt(endsAt);
        autoSegmentTimerRef.current = setTimeout(() => {
            const recorder = mediaRecorderRef.current;
            if (recorder &&
                recorder.state !== 'inactive' &&
                activeModeRef.current === mode &&
                appModeRef.current === 'record' &&
                autoSegmentModeRef.current !== 'off') {
                autoSegmentContinueRef.current = true;
                try {
                    recorder.stop();
                }
                catch (error) {
                    console.warn('自動切段停止失敗', error);
                }
            }
        }, duration);
    };
    const getSegmentCountdownText = () => {
        if (!segmentEndsAt || autoSegmentMode === 'off' || appMode !== 'record' || !activeMode)
            return '';
        const remain = Math.max(0, Math.ceil((segmentEndsAt - nowTick) / 1000));
        const minutes = Math.floor(remain / 60);
        const seconds = remain % 60;
        return `${minutes}:${pad2(seconds)}`;
    };
    const cycleAutoSegmentMode = () => {
        const nextMode = autoSegmentMode === 'off' ? '1' : autoSegmentMode === '1' ? '5' : autoSegmentMode === '5' ? '15' : 'off';
        setAutoSegmentMode(nextMode);
    };
    const formatDateTimeForFilename = (input = new Date()) => {
        const date = input instanceof Date ? input : new Date(input);
        const safeDate = Number.isNaN(date.getTime()) ? new Date() : date;
        return `${safeDate.getFullYear()}-${pad2(safeDate.getMonth() + 1)}-${pad2(safeDate.getDate())}_${pad2(safeDate.getHours())}-${pad2(safeDate.getMinutes())}-${pad2(safeDate.getSeconds())}`;
    };
    const sanitizeFilenamePart = (value) => {
        return String(value ?? '')
            .replace(/[\\/:*?"<>|]+/g, '')
            .replace(/\s+/g, '_')
            .slice(0, 36) || 'audio';
    };
    const getSpeakerLabelForFilename = (sender) => {
