<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多國語言口譯系統 (進階完整版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .mic-wave { display: inline-block; position: relative; }
        .mic-wave::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 100%; height: 100%; border-radius: 50%;
            background-color: rgba(59, 130, 246, 0.5);
            transform: translate(-50%, -50%) scale(1);
            animation: wave 1.5s infinite; z-index: -1;
        }
        @keyframes wave {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }
        .message-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 模型分流：即時字幕用快速文字模型；錄音/匯入音檔保留原本較強的音訊模型
        const AUDIO_MODEL_NAME = "gemini-3-flash-preview";
        const FAST_TEXT_MODEL_NAME = "gemini-3.1-flash-lite";
        const FAST_TEXT_FALLBACK_MODEL_NAME = "gemini-2.5-flash-lite";
        const MODEL_NAME = AUDIO_MODEL_NAME;
        const LIVE_DRAFT_INTERVAL_MS = 900;

        const SUPPORTED_LANGUAGES = {
            ja: { name: "日本語", promptName: "Japanese", sttLang: "ja-JP", ttsLang: "ja-JP", instruction: "長押しで話す" },
            en: { name: "English", promptName: "English", sttLang: "en-US", ttsLang: "en-US", instruction: "Hold to speak" },
            ko: { name: "한국어", promptName: "Korean", sttLang: "ko-KR", ttsLang: "ko-KR", instruction: "길게 눌러 말하기" },
            de: { name: "Deutsch", promptName: "German", sttLang: "de-DE", ttsLang: "de-DE", instruction: "Zum Sprechen halten" },
            fr: { name: "Français", promptName: "French", sttLang: "fr-FR", ttsLang: "fr-FR", instruction: "Maintenez pour parler" }
        };

        function App() {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [inputKey, setInputKey] = useState('');
            const [isConfigured, setIsConfigured] = useState(!!localStorage.getItem('gemini_api_key'));
            const [targetLang, setTargetLang] = useState('ja');
            
            const [autoSaveAudio, setAutoSaveAudio] = useState(false);
            const autoSaveAudioRef = useRef(autoSaveAudio);
            useEffect(() => {
                autoSaveAudioRef.current = autoSaveAudio;
            }, [autoSaveAudio]);

            // 自動朗讀譯文：預設開啟，並記住使用者上次設定
            const [autoPlayTranslation, setAutoPlayTranslation] = useState(() => localStorage.getItem('auto_play_translation') !== 'false');
            const autoPlayTranslationRef = useRef(autoPlayTranslation);
            useEffect(() => {
                autoPlayTranslationRef.current = autoPlayTranslation;
                localStorage.setItem('auto_play_translation', autoPlayTranslation ? 'true' : 'false');
            }, [autoPlayTranslation]);

            const saveApiKey = () => {
                if (inputKey.trim()) {
                    localStorage.setItem('gemini_api_key', inputKey.trim());
                    setApiKey(inputKey.trim());
                    setIsConfigured(true);
                } else {
                    alert("請輸入有效的 API Key");
                }
            };

            const resetApiKey = () => {
                if(confirm("確定要清除記憶的 API Key 嗎？")) {
                    localStorage.removeItem('gemini_api_key');
                    setApiKey('');
                    setInputKey('');
                    setIsConfigured(false);
                }
            };

            const [messages, setMessages] = useState([]);
            const [appMode, setAppMode] = useState('stream'); 
            const [isPushToTalk, setIsPushToTalk] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [speakingId, setSpeakingId] = useState(null); 
            const [activeMode, setActiveMode] = useState(null);
            const [interimText, setInterimText] = useState("");
            const [liveDraftTranslation, setLiveDraftTranslation] = useState("");
            const [liveDraftLoading, setLiveDraftLoading] = useState(false);
            const [voices, setVoices] = useState([]);

            const recognitionRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const messagesEndRef = useRef(null);
            const backupTranscriptRef = useRef("");
            const backupInterimTranscriptRef = useRef("");
            const ttsPauseRef = useRef(false);
            const ttsSessionRef = useRef(0);
            const activeModeRef = useRef(null);
            const appModeRef = useRef(appMode);
            const isListeningRef = useRef(isListening);
            const isPushToTalkRef = useRef(isPushToTalk);
            const liveDraftTimerRef = useRef(null);
            const liveDraftSeqRef = useRef(0);
            const liveDraftInFlightRef = useRef(false);
            const liveDraftPendingRef = useRef(null);
            const liveDraftLastStartedAtRef = useRef(0);
            const liveDraftTextRef = useRef("");

            const fileInputRef = useRef(null);
            const uploadSenderRef = useRef('user');

            useEffect(() => { activeModeRef.current = activeMode; }, [activeMode]);
            useEffect(() => { appModeRef.current = appMode; }, [appMode]);
            useEffect(() => { isListeningRef.current = isListening; }, [isListening]);
            useEffect(() => { isPushToTalkRef.current = isPushToTalk; }, [isPushToTalk]);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, interimText, liveDraftTranslation]);

            useEffect(() => {
                if (!('speechSynthesis' in window)) return;
                const loadVoices = () => {
                    const availableVoices = window.speechSynthesis.getVoices();
                    if (availableVoices.length > 0) setVoices(availableVoices);
                };
                loadVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }
            }, []);

            const getTtsLangForSender = (sender) => {
                return sender === 'me' ? SUPPORTED_LANGUAGES[targetLang].ttsLang : 'zh-TW';
            };

            const isSpeakableTranslation = (text) => {
                if (!text || typeof text !== 'string') return false;
                const trimmed = text.trim();
                if (!trimmed) return false;
                const blockedKeywords = ['翻譯失敗', '連線錯誤', '網路連線', '請檢查', '音訊處理失敗', '匯入音檔解析失敗', '欄位空白', '毫無回應'];
                return !trimmed.startsWith('[') && !blockedKeywords.some(keyword => trimmed.includes(keyword));
            };

            const getPreferredVoice = (lang) => {
                if (!lang || voices.length === 0) return null;
                const normalizedLang = lang.toLowerCase();
                const langRoot = normalizedLang.split('-')[0];
                const matchingVoices = voices.filter(v => {
                    const voiceLang = (v.lang || '').toLowerCase();
                    return voiceLang === normalizedLang || voiceLang.startsWith(langRoot);
                });
                if (matchingVoices.length === 0) return null;

                const isChinese = normalizedLang.startsWith('zh');
                const taiwanFirst = isChinese
                    ? matchingVoices.filter(v => {
                        const voiceLang = (v.lang || '').toLowerCase();
                        return voiceLang.includes('tw') || voiceLang.includes('hant') || voiceLang.includes('cmn-hant');
                    })
                    : matchingVoices;
                const pool = taiwanFirst.length > 0 ? taiwanFirst : matchingVoices;

                const preferredKeywords = isChinese
                    ? ['google', 'microsoft hsiaochen', 'microsoft hanhan', 'microsoft yunjhe', 'microsoft tracy', 'mei-jia', 'mei jia', 'ting-ting', 'sinji', 'natural', 'neural']
                    : ['google', 'microsoft', 'natural', 'neural', 'enhanced', 'premium'];

                for (const keyword of preferredKeywords) {
                    const found = pool.find(v => (v.name || '').toLowerCase().includes(keyword));
                    if (found) return found;
                }
                return pool[0] || matchingVoices[0];
            };

            const speakText = (text, lang, id, options = {}) => {
                if (!('speechSynthesis' in window) || !text) return;

                const { pauseRecognition = false, resumeMode = null } = options;
                const shouldPauseRecognition = pauseRecognition && recognitionRef.current && appModeRef.current === 'stream';

                if (shouldPauseRecognition) {
                    ttsPauseRef.current = true;
                    try { recognitionRef.current.stop(); } catch(e) { console.warn('暫停語音辨識失敗', e); }
                }

                const currentTtsSession = ttsSessionRef.current + 1;
                ttsSessionRef.current = currentTtsSession;
                window.speechSynthesis.cancel();
                setSpeakingId(null);

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang; 
                utterance.rate = lang && lang.startsWith('zh') ? 0.92 : 1.0;
                utterance.pitch = lang && lang.startsWith('zh') ? 1.05 : 1.0;
                if (voices.length > 0) {
                    const targetVoice = getPreferredVoice(lang);
                    if (targetVoice) utterance.voice = targetVoice;
                }

                const finishSpeaking = () => {
                    if (currentTtsSession !== ttsSessionRef.current) return;
                    setSpeakingId(null);
                    if (shouldPauseRecognition) {
                        setTimeout(() => {
                            ttsPauseRef.current = false;
                            const modeToResume = resumeMode || activeModeRef.current;
                            if (modeToResume && appModeRef.current === 'stream' && isListeningRef.current && !isPushToTalkRef.current) {
                                startListeningStream(modeToResume);
                            }
                        }, 300);
                    }
                };

                utterance.onstart = () => setSpeakingId(id);
                utterance.onend = finishSpeaking;
                utterance.onerror = finishSpeaking;

                try {
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    console.warn('朗讀失敗', e);
                    finishSpeaking();
                }
            };

            const autoSpeakTranslation = (translation, sender, id, sourceMode = null) => {
                if (!autoPlayTranslationRef.current || !isSpeakableTranslation(translation)) return;
                const ttsLang = getTtsLangForSender(sender);
                const pauseRecognition = appModeRef.current === 'stream' && recognitionRef.current && activeModeRef.current && !isPushToTalkRef.current;
                setTimeout(() => {
                    speakText(translation, ttsLang, id, { pauseRecognition, resumeMode: sourceMode });
                }, 250);
            };

            const blobToBase64 = (blob) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        if (typeof reader.result === 'string') resolve(reader.result.split(',')[1]);
                        else reject(new Error("Failed to convert blob to base64"));
                    };
                    reader.readAsDataURL(blob);
                });
            };

            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const normalizeTranscriptForFallback = (value = '') => {
                return String(value || '')
                    .replace(/\u3000/g, ' ')
                    .replace(/\s+/g, ' ')
                    .replace(/^[\s。！？!?.,，、；;：:「」『』"'()（）【】\[\]{}]+|[\s。！？!?.,，、；;：:「」『』"'()（）【】\[\]{}]+$/g, '')
                    .trim();
            };

            const countCjkKanaHangul = (value = '') => {
                return (String(value).match(/[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]/g) || []).length;
            };

            const countLatinWords = (value = '') => {
                return (String(value).match(/[A-Za-zÀ-ÿ0-9]+/g) || []).length;
            };

            const isReliableBackupTranscript = (text, mode) => {
                const cleaned = normalizeTranscriptForFallback(text);
                if (!cleaned) return false;

                const compact = cleaned.replace(/[\s。！？!?.,，、；;：:「」『』"'()（）【】\[\]{}]/g, '');
                const fillerOnly = /^(嗯+|呃+|啊+|喔+|哦+|好+|是+|はい+|え+|あ+|うん+|はいはい+|yes|yeah|ok|okay)$/i.test(compact);
                if (fillerOnly) return false;

                const cjkCount = countCjkKanaHangul(cleaned);
                const latinWordCount = countLatinWords(cleaned);
                const nonSpaceLength = cleaned.replace(/\s/g, '').length;

                // 備援翻譯只使用穩定 final transcript。太短的辨識很容易是雜音或尚未完成的片段，避免亂翻。
                if (mode === 'user' || ['ja', 'ko'].includes(targetLang)) {
                    return cjkCount >= 5 || nonSpaceLength >= 8 || latinWordCount >= 3;
                }
                return latinWordCount >= 3 || nonSpaceLength >= 10 || cjkCount >= 5;
            };

            const getStableBackupTranscript = (mode) => {
                const finalText = normalizeTranscriptForFallback(backupTranscriptRef.current);
                if (isReliableBackupTranscript(finalText, mode)) return { text: finalText, source: 'final' };
                return { text: '', source: '' };
            };

            const isGeminiAudioResultUnusable = (result = {}) => {
                const original = String(result.original || '');
                const translation = String(result.translation || '');
                return !original.trim() ||
                    original === '[原文欄位空白]' ||
                    original.includes('無法辨識') ||
                    original.includes('音檔解析失敗') ||
                    translation.includes('音訊處理失敗') ||
                    translation.includes('音檔格式解析失敗') ||
                    translation.includes('請檢查網路');
            };

            const pad2 = (value) => String(value).padStart(2, '0');

            const formatDateTimeForFilename = (input = new Date()) => {
                const date = input instanceof Date ? input : new Date(input);
                const safeDate = Number.isNaN(date.getTime()) ? new Date() : date;
                return `${safeDate.getFullYear()}-${pad2(safeDate.getMonth() + 1)}-${pad2(safeDate.getDate())}_${pad2(safeDate.getHours())}-${pad2(safeDate.getMinutes())}-${pad2(safeDate.getSeconds())}`;
            };

            const sanitizeFilenamePart = (value) => {
                return String(value ?? '')
                    .replace(/[\\/:*?"<>|]+/g, '')
                    .replace(/\s+/g, '_')
                    .slice(0, 36) || 'audio';
            };

            const getSpeakerLabelForFilename = (sender) => {
                if (sender === 'me' || sender === 'user') return '中文';
                return SUPPORTED_LANGUAGES[targetLang]?.name || '外語';
            };

            const getAudioExtensionFromMime = (mimeType = '', fallback = 'webm') => {
                const cleanMime = String(mimeType || '').toLowerCase().split(';')[0].trim();
                const map = {
                    'audio/webm': 'webm',
                    'video/webm': 'webm',
                    'audio/mpeg': 'mp3',
                    'audio/mp3': 'mp3',
                    'audio/wav': 'wav',
                    'audio/x-wav': 'wav',
                    'audio/mp4': 'm4a',
                    'audio/x-m4a': 'm4a',
                    'audio/aac': 'aac',
                    'audio/ogg': 'ogg',
                    'application/ogg': 'ogg',
                    'audio/flac': 'flac',
                    'audio/aiff': 'aiff',
                    'audio/x-aiff': 'aiff'
                };
                return map[cleanMime] || fallback;
            };

            const createAudioFilename = (sender, timeSource = Date.now(), mimeType = 'audio/webm') => {
                const date = typeof timeSource === 'number' ? new Date(timeSource) : new Date(timeSource || Date.now());
                const label = sanitizeFilenamePart(getSpeakerLabelForFilename(sender));
                const extension = getAudioExtensionFromMime(mimeType, 'webm');
                return `${formatDateTimeForFilename(date)}_${label}.${extension}`;
            };

            const getFileExtension = (filename = '') => {
                const cleanName = String(filename || '').toLowerCase().split('?')[0].split('#')[0];
                const match = cleanName.match(/\.([a-z0-9]+)$/);
                return match ? match[1] : '';
            };

            const normalizeAudioMimeType = (mimeType = '', filename = '') => {
                const rawMime = String(mimeType || '').toLowerCase().split(';')[0].trim();
                const extension = getFileExtension(filename);
                const extensionMap = {
                    webm: 'audio/webm',
                    mp3: 'audio/mpeg',
                    mpeg: 'audio/mpeg',
                    mpg: 'audio/mpeg',
                    wav: 'audio/wav',
                    wave: 'audio/wav',
                    m4a: 'audio/mp4',
                    mp4: 'audio/mp4',
                    aac: 'audio/aac',
                    ogg: 'audio/ogg',
                    oga: 'audio/ogg',
                    opus: 'audio/ogg',
                    flac: 'audio/flac',
                    aiff: 'audio/aiff',
                    aif: 'audio/aiff'
                };

                const normalizedMimeMap = {
                    'audio/mp3': 'audio/mpeg',
                    'audio/x-mp3': 'audio/mpeg',
                    'audio/x-mpeg': 'audio/mpeg',
                    'audio/x-wav': 'audio/wav',
                    'audio/wave': 'audio/wav',
                    'audio/x-m4a': 'audio/mp4',
                    'audio/m4a': 'audio/mp4',
                    'audio/aacp': 'audio/aac',
                    'audio/x-aiff': 'audio/aiff'
                };

                const extensionMime = extensionMap[extension];
                const looksGeneric = !rawMime || rawMime === 'application/octet-stream' || rawMime === 'binary/octet-stream';

                if (extensionMime && (looksGeneric || rawMime.startsWith('video/') || rawMime === 'application/ogg')) {
                    return extensionMime;
                }

                return normalizedMimeMap[rawMime] || rawMime || extensionMime || 'audio/webm';
            };

            const getAudioMimeCandidates = (fileOrMime, filename = '') => {
                const rawMime = typeof fileOrMime === 'string' ? fileOrMime : (fileOrMime?.type || '');
                const rawName = typeof fileOrMime === 'string' ? filename : (fileOrMime?.name || filename || '');
                const primary = normalizeAudioMimeType(rawMime, rawName);
                const extension = getFileExtension(rawName);
                const candidates = [primary];

                if (extension === 'webm' || primary === 'audio/webm' || primary === 'video/webm') {
                    candidates.push('audio/webm', 'video/webm');
                }
                if (extension === 'ogg' || extension === 'oga' || primary === 'audio/ogg' || primary === 'application/ogg') {
                    candidates.push('audio/ogg', 'application/ogg');
                }
                if (extension === 'mp3' || primary === 'audio/mpeg') {
                    candidates.push('audio/mpeg', 'audio/mp3');
                }
                if (extension === 'm4a' || extension === 'mp4' || primary === 'audio/mp4') {
                    candidates.push('audio/mp4', 'audio/aac');
                }

                return [...new Set(candidates.filter(Boolean))];
            };

            const isLikelyAudioFormatError = (message = '') => {
                return /mime|media|audio|video|format|decode|unsupported|invalid|file|payload/i.test(String(message));
            };

            const getFriendlyAudioError = (message = '') => {
                const lower = String(message || '').toLowerCase();
                if (lower.includes('api key') || lower.includes('permission') || lower.includes('auth')) {
                    return '金鑰或權限錯誤，請重新確認 Gemini API Key。';
                }
                if (isLikelyAudioFormatError(message)) {
                    return '音檔格式解析失敗。若是重新匯入已儲存的錄音，請保留 .webm 副檔名；若仍失敗，建議改用 wav、mp3、m4a 或 ogg。';
                }
                return '音訊處理失敗，請確認網路、金鑰、檔案大小或稍後再試。';
            };

            const isTranslatableLiveText = (text, mode) => {
                const cleaned = normalizeTranscriptForFallback(text);
                if (!cleaned) return false;
                const compact = cleaned.replace(/[\s。！？!?.,，、；;：:「」『』"'()（）【】\[\]{}]/g, '');
                const fillerOnly = /^(嗯+|呃+|啊+|喔+|哦+|好+|是+|はい+|え+|あ+|うん+|はいはい+|yes|yeah|ok|okay)$/i.test(compact);
                if (fillerOnly) return false;

                const cjkCount = countCjkKanaHangul(cleaned);
                const latinWordCount = countLatinWords(cleaned);
                const nonSpaceLength = cleaned.replace(/\s/g, '').length;

                // 暫譯門檻比備援低一點，讓字幕更早出現；final 翻譯仍會再修正一次。
                if (mode === 'user' || ['ja', 'ko'].includes(targetLang)) {
                    return cjkCount >= 4 || nonSpaceLength >= 6 || latinWordCount >= 2;
                }
                return latinWordCount >= 2 || nonSpaceLength >= 7 || cjkCount >= 4;
            };

            const getTextModelCandidates = (preferredModel) => {
                return [...new Set([preferredModel, FAST_TEXT_MODEL_NAME, FAST_TEXT_FALLBACK_MODEL_NAME, MODEL_NAME].filter(Boolean))];
            };

            const clearLiveDraftTranslation = () => {
                if (liveDraftTimerRef.current) {
                    clearTimeout(liveDraftTimerRef.current);
                    liveDraftTimerRef.current = null;
                }
                liveDraftSeqRef.current += 1;
                liveDraftPendingRef.current = null;
                liveDraftTextRef.current = "";
                setLiveDraftLoading(false);
                setLiveDraftTranslation("");
            };

            const translateTextWithGemini = async (text, sourceLang, options = {}) => {
                const selectedLangConfig = SUPPORTED_LANGUAGES[targetLang];
                const destLangName = sourceLang === 'zh' ? selectedLangConfig.promptName : 'Traditional Chinese';
                const sourceLangName = sourceLang === 'zh' ? 'Traditional Chinese' : selectedLangConfig.promptName;
                const cleanedText = normalizeTranscriptForFallback(text);
                if (!cleanedText) return "[翻譯失敗]";

                const { draft = false, realtime = false, modelName = null } = options;
                const systemPrompt = draft
                    ? `You are a low-latency subtitle translator. The ${sourceLangName} text may be partial. Translate it to ${destLangName} faithfully. Do NOT invent missing words, do NOT complete unfinished sentences, and do NOT explain. Output ONLY the translated text.`
                    : `You are a professional real-time interpreter. Translate the following ${sourceLangName} text to ${destLangName}. Output ONLY the translated text. No explanations.`;

                const modelCandidates = getTextModelCandidates(modelName || (realtime || draft ? FAST_TEXT_MODEL_NAME : MODEL_NAME));
                const maxAttemptsPerModel = realtime || draft ? 2 : 4;
                const delays = realtime || draft ? [500, 1000] : [1000, 2000, 4000, 8000];
                let lastErrorMessage = '';

                for (const currentModelName of modelCandidates) {
                    for (let attempt = 0; attempt <= maxAttemptsPerModel; attempt++) {
                        try {
                            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${currentModelName}:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: `${systemPrompt}\n\nOriginal Text: "${cleanedText}"` }] }],
                                    generationConfig: {
                                        temperature: realtime || draft ? 0.2 : 0.4,
                                        maxOutputTokens: draft ? 256 : 768
                                    }
                                })
                            });
                            const data = await response.json();
                            if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
                            const output = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                            return output || "[翻譯失敗]";
                        } catch (error) {
                            lastErrorMessage = error?.message || String(error || '未知錯誤');
                            const modelUnavailable = /not found|not supported|permission|model/i.test(lastErrorMessage);
                            if (modelUnavailable) break;
                            if (attempt < maxAttemptsPerModel) await sleep(delays[Math.min(attempt, delays.length - 1)]);
                        }
                    }
                }
                console.warn('文字翻譯失敗：', lastErrorMessage);
                return "[連線錯誤，請檢查金鑰或網路]";
            };

            const runLiveDraftTranslation = async (mode, text, seq) => {
                const cleaned = normalizeTranscriptForFallback(text);
                if (!isTranslatableLiveText(cleaned, mode)) {
                    if (seq === liveDraftSeqRef.current) setLiveDraftLoading(false);
                    return;
                }

                liveDraftInFlightRef.current = true;
                liveDraftLastStartedAtRef.current = Date.now();
                setLiveDraftLoading(true);

                const sourceLangCode = mode === 'user' ? 'zh' : targetLang;
                const translation = await translateTextWithGemini(cleaned, sourceLangCode, {
                    draft: true,
                    realtime: true,
                    modelName: FAST_TEXT_MODEL_NAME
                });

                if (seq === liveDraftSeqRef.current && liveDraftTextRef.current === cleaned && activeModeRef.current === mode && appModeRef.current === 'stream') {
                    if (isSpeakableTranslation(translation)) {
                        setLiveDraftTranslation(translation);
                    }
                    setLiveDraftLoading(false);
                }

                liveDraftInFlightRef.current = false;
                const pending = liveDraftPendingRef.current;
                liveDraftPendingRef.current = null;
                if (pending && pending.text !== cleaned && activeModeRef.current === pending.mode && appModeRef.current === 'stream') {
                    scheduleLiveDraftTranslation(pending.mode, pending.text);
                }
            };

            const scheduleLiveDraftTranslation = (mode, text) => {
                const cleaned = normalizeTranscriptForFallback(text);
                liveDraftTextRef.current = cleaned;

                if (!isTranslatableLiveText(cleaned, mode)) {
                    setLiveDraftTranslation("");
                    setLiveDraftLoading(false);
                    return;
                }

                if (liveDraftInFlightRef.current) {
                    liveDraftPendingRef.current = { mode, text: cleaned };
                    setLiveDraftLoading(true);
                    return;
                }

                if (liveDraftTimerRef.current) clearTimeout(liveDraftTimerRef.current);
                const now = Date.now();
                const elapsed = now - liveDraftLastStartedAtRef.current;
                const delay = Math.max(0, LIVE_DRAFT_INTERVAL_MS - elapsed);
                const seq = liveDraftSeqRef.current + 1;
                liveDraftSeqRef.current = seq;
                setLiveDraftLoading(true);

                liveDraftTimerRef.current = setTimeout(() => {
                    liveDraftTimerRef.current = null;
                    runLiveDraftTranslation(mode, cleaned, seq);
                }, delay);
            };

            const translateBackupTranscriptWithGemini = async (text, sourceLang) => {
                const cleanedText = normalizeTranscriptForFallback(text);
                if (!cleanedText) return "[備援辨識不足，請重新錄音]";

                const selectedLangConfig = SUPPORTED_LANGUAGES[targetLang];
                const destLangName = sourceLang === 'zh' ? selectedLangConfig.promptName : 'Traditional Chinese';
                const sourceLangName = sourceLang === 'zh' ? 'Traditional Chinese' : selectedLangConfig.promptName;
                const systemPrompt = `You are translating a fallback speech-recognition transcript from ${sourceLangName} to ${destLangName}. Translate ONLY the exact transcript. Do not guess missing words. Do not add context. Do not summarize. If the transcript is too short, noisy, or unclear, output exactly: [備援辨識不足，請重新錄音]. Output ONLY the translated text.`;

                const delays = [800, 1600, 3200];
                for (let attempt = 0; attempt <= 3; attempt++) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AUDIO_MODEL_NAME}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: `${systemPrompt}\n\nFallback transcript: "${cleanedText}"` }] }] })
                        });
                        const data = await response.json();
                        if (data.error) throw new Error(data.error.message);
                        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "[備援翻譯失敗]";
                    } catch (error) {
                        if (attempt < 3) await sleep(delays[attempt]);
                        else return "[連線錯誤，請檢查金鑰或網路]";
                    }
                }
            };

            const processAudioWithGemini = async (audioBase64, mode, messageId, mimeType = "audio/webm") => {
                const selectedLangConfig = SUPPORTED_LANGUAGES[targetLang];
                const sourceLangName = mode === 'user' ? 'Mandarin Chinese' : selectedLangConfig.promptName;
                const destLangName = mode === 'user' ? selectedLangConfig.promptName : 'Traditional Chinese';
                const mimeCandidates = Array.isArray(mimeType) ? [...new Set(mimeType.filter(Boolean))] : getAudioMimeCandidates(mimeType);
                let lastErrorMessage = '';
                
                const transcribeInstruction = mode === 'user' ? "Transcribe exactly in Traditional Chinese (繁體中文)." : `Transcribe exactly in ${selectedLangConfig.promptName}.`;
                
                const systemPrompt = `You are a simultaneous interpreter.
1. Listen to the audio (${sourceLangName}).
2. ${transcribeInstruction}
3. Translate to ${destLangName}.
Output strictly in valid JSON format with only two keys: "transcription" and "translation". Do not include markdown code blocks.`;

                const delays = [800, 1600, 3200];
                for (let mimeIndex = 0; mimeIndex < mimeCandidates.length; mimeIndex++) {
                    const currentMimeType = mimeCandidates[mimeIndex];

                    for (let attempt = 0; attempt <= 3; attempt++) {
                        try {
                            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AUDIO_MODEL_NAME}:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: systemPrompt }, { inlineData: { mimeType: currentMimeType, data: audioBase64 } }] }],
                                    generationConfig: { responseMimeType: "application/json" }
                                })
                            });
                            const data = await response.json();
                            if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
                            
                            let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                            let cleanText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                            
                            let originalText = "";
                            let translationText = "";

                            try {
                                const result = JSON.parse(cleanText);
                                translationText = result.translation || result.translated || result.Translation || "[翻譯欄位空白]";
                                originalText = result.transcription || result.original || result.text || "[原文欄位空白]";
                            } catch (parseError) {
                                console.warn("JSON 解析失敗，啟用生肉救援模式");
                                originalText = "⚠️ AI 未按格式回覆，以下為原始內容：";
                                translationText = rawText || "[AI 毫無回應]"; 
                            }

                            return { original: originalText, translation: translationText };

                        } catch (error) {
                            lastErrorMessage = error?.message || String(error || '未知錯誤');
                            console.warn(`音訊處理失敗（mime=${currentMimeType}, attempt=${attempt + 1}）：`, lastErrorMessage);

                            // 重新匯入瀏覽器存下來的 .webm 時，不同系統可能標成 audio/webm、video/webm 或空白 MIME。
                            // 若看起來是格式/MIME 問題，先換下一個 MIME 標籤重試，不要直接顯示「網路失敗」。
                            if (attempt === 0 && isLikelyAudioFormatError(lastErrorMessage) && mimeIndex < mimeCandidates.length - 1) {
                                break;
                            }

                            if (attempt < 3) {
                                await new Promise(resolve => setTimeout(resolve, delays[attempt]));
                            } else if (mimeIndex < mimeCandidates.length - 1) {
                                break;
                            } else {
                                return { original: "[音檔解析失敗]", translation: getFriendlyAudioError(lastErrorMessage) };
                            }
                        }
                    }
                }

                return { original: "[音檔解析失敗]", translation: getFriendlyAudioError(lastErrorMessage) };
            };

            const startListeningStream = (mode) => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert("您的瀏覽器不支援 Web Speech API。"); return;
                }
                clearLiveDraftTranslation();
                if (recognitionRef.current) {
                    try { recognitionRef.current.stop(); } catch(e) {}
                }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                const selectedLangConfig = SUPPORTED_LANGUAGES[targetLang];
                recognition.lang = mode === 'user' ? 'cmn-Hant-TW' : selectedLangConfig.sttLang;
                
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => { 
                    setIsListening(true); 
                    setActiveMode(mode); 
                    isListeningRef.current = true;
                    activeModeRef.current = mode;
                };
                recognition.onerror = (e) => { if (e.error === 'not-allowed') { stopAll(); alert("請允許麥克風權限"); } };
                recognition.onend = () => {
                    // 自動朗讀時會短暫暫停語音辨識，避免喇叭聲被再次聽進去造成回音循環
                    if (ttsPauseRef.current) return;

                    if (isListeningRef.current && !isPushToTalkRef.current) {
                        setTimeout(() => {
                            if (activeModeRef.current === mode && isListeningRef.current && appModeRef.current === 'stream') {
                                try { recognition.start(); } catch(e) { stopAll(); }
                            }
                        }, 500);
                    } else {
                        setIsListening(false); 
                        setActiveMode(null);
                        isListeningRef.current = false;
                        activeModeRef.current = null;
                        clearLiveDraftTranslation();
                    }
                };

                recognition.onresult = async (event) => {
                    let finalTranscript = '';
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        const transcript = event.results[i][0].transcript || '';
                        if (event.results[i].isFinal) finalTranscript += `${transcript} `;
                        else interimTranscript += transcript;
                    }

                    const cleanedInterim = normalizeTranscriptForFallback(interimTranscript);
                    setInterimText(cleanedInterim);
                    if (cleanedInterim) {
                        scheduleLiveDraftTranslation(mode, cleanedInterim);
                    }

                    const cleanedFinal = normalizeTranscriptForFallback(finalTranscript);
                    if (cleanedFinal) {
                        clearLiveDraftTranslation();
                        const newMsgId = Date.now();
                        const sender = mode === 'user' ? 'me' : 'partner';
                        setMessages(prev => [...prev, { id: newMsgId, text: cleanedFinal, translation: "翻譯中...", sender: sender, loading: true, mode: 'stream', realtimeModel: FAST_TEXT_MODEL_NAME }]);
                        const sourceLangCode = mode === 'user' ? 'zh' : targetLang;
                        const translation = await translateTextWithGemini(cleanedFinal, sourceLangCode, { realtime: true, modelName: FAST_TEXT_MODEL_NAME });
                        setMessages(prev => prev.map(msg => msg.id === newMsgId ? { ...msg, translation: translation, loading: false } : msg));
                        autoSpeakTranslation(translation, sender, newMsgId, mode);
                        setInterimText("");
                    }
                };
                recognitionRef.current = recognition;
                recognition.start();
            };

            const startRecordingAudio = async (mode) => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    let localChunks = [];
                    mediaRecorderRef.current = mediaRecorder;

                    backupTranscriptRef.current = "";
                    backupInterimTranscriptRef.current = "";
                    let backupRecognition = null;
                    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                        backupRecognition = new SpeechRecognition();
                        const selectedLangConfig = SUPPORTED_LANGUAGES[targetLang];
                        backupRecognition.lang = mode === 'user' ? 'cmn-Hant-TW' : selectedLangConfig.sttLang;
                        backupRecognition.continuous = true;
                        backupRecognition.interimResults = true;
                        
                        backupRecognition.onresult = (event) => {
                            let finalTranscript = '';
                            let interimTranscript = '';
                            for (let i = 0; i < event.results.length; ++i) {
                                const transcript = event.results[i][0].transcript || '';
                                if (event.results[i].isFinal) finalTranscript += transcript + ' ';
                                else interimTranscript += transcript + ' ';
                            }

                            if (finalTranscript.trim()) {
                                backupTranscriptRef.current = normalizeTranscriptForFallback(finalTranscript);
                            }
                            backupInterimTranscriptRef.current = normalizeTranscriptForFallback(interimTranscript);
                        };
                    }

                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) localChunks.push(e.data); };
                    
                    mediaRecorder.onstart = () => { 
                        setIsRecording(true); 
                        setActiveMode(mode); 
                        if (backupRecognition) {
                            try { backupRecognition.start(); } catch(e) { console.warn("備用引擎啟動失敗", e); }
                        }
                    };
                    
                    mediaRecorder.onstop = async () => {
                        setIsRecording(false); setActiveMode(null);
                        stream.getTracks().forEach(track => track.stop());
                        
                        if (backupRecognition) {
                            try { backupRecognition.stop(); } catch(e) {}
                            // 給 Web Speech 一點時間送出最後的 final transcript；不要立即使用尚未穩定的 interim 文字。
                            await sleep(350);
                        }

                        if (localChunks.length === 0) return;

                        const tempMsgId = Date.now();
                        const sender = mode === 'user' ? 'me' : 'partner';
                        
                        const audioBlob = new Blob(localChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audioMimeType = audioBlob.type || 'audio/webm';
                        const audioFilename = createAudioFilename(sender, tempMsgId, audioMimeType);

                        if (autoSaveAudioRef.current) {
                            const a = document.createElement('a');
                            a.style.display = 'none';
                            a.href = audioUrl;
                            a.download = audioFilename;
                            document.body.appendChild(a);
                            a.click();
                            setTimeout(() => { document.body.removeChild(a); }, 100);
                        }

                        setMessages(prev => [...prev, { 
                            id: tempMsgId, 
                            text: "音訊上傳處理中...", 
                            translation: "Gemini 聽打翻譯中...", 
                            sender: sender, 
                            loading: true, 
                            mode: 'record',
                            audioUrl: audioUrl,
                            audioMimeType: audioMimeType,
                            audioFileName: audioFilename
                        }]);
                        
                        try {
                            const base64Audio = await blobToBase64(audioBlob);
                            let result = await processAudioWithGemini(base64Audio, mode, tempMsgId, getAudioMimeCandidates(audioMimeType));
                            
                            const backupCandidate = getStableBackupTranscript(mode);
                            if (isGeminiAudioResultUnusable(result) && backupCandidate.text) {
                                console.log(`啟動穩定雙引擎備援（${backupCandidate.source} transcript）`);
                                const backupText = backupCandidate.text;
                                const sourceLangCode = mode === 'user' ? 'zh' : targetLang;
                                
                                setMessages(prev => prev.map(msg => msg.id === tempMsgId ? { ...msg, text: backupText, translation: "啟用穩定備援翻譯中...", loading: true } : msg));
                                
                                const fallbackTranslation = await translateBackupTranscriptWithGemini(backupText, sourceLangCode);
                                result = { original: backupText, translation: fallbackTranslation };
                            } else if (isGeminiAudioResultUnusable(result) && backupInterimTranscriptRef.current) {
                                console.warn("備援辨識只有暫時文字或內容太短，已略過，避免亂翻譯：", backupInterimTranscriptRef.current);
                            }

                            setMessages(prev => prev.map(msg => msg.id === tempMsgId ? { ...msg, text: result.original, translation: result.translation, loading: false } : msg));
                            autoSpeakTranslation(result.translation, sender, tempMsgId);
                        } catch (e) {
                            setMessages(prev => prev.map(msg => msg.id === tempMsgId ? { ...msg, text: "錯誤", translation: "音訊處理失敗", loading: false } : msg));
                        }
                    };
                    mediaRecorder.start();
                } catch (err) { alert("無法存取麥克風，請檢查權限。"); }
            };

            const stopAll = () => {
                setIsListening(false); setIsRecording(false);
                isListeningRef.current = false;
                activeModeRef.current = null;
                ttsPauseRef.current = false;
                ttsSessionRef.current += 1;
                if (recognitionRef.current) {
                    try { recognitionRef.current.stop(); } catch(e) {}
                }
                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') mediaRecorderRef.current.stop();
                else setActiveMode(null);
                setInterimText("");
                clearLiveDraftTranslation();
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            };

            const handleCutAndContinue = (mode) => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    mediaRecorderRef.current.stop();
                } else if (recognitionRef.current) {
                    recognitionRef.current.stop();
                }

                setTimeout(() => {
                    if (appMode === 'stream') {
                        startListeningStream(mode);
                    } else {
                        startRecordingAudio(mode);
                    }
                }, 300);
            };

            const handleModeButtonPress = (mode) => {
                if (activeMode === mode) { stopAll(); return; }
                if (activeMode !== null) {
                    stopAll();
                    setTimeout(() => { appMode === 'stream' ? startListeningStream(mode) : startRecordingAudio(mode); }, 200);
                    return;
                }
                appMode === 'stream' ? startListeningStream(mode) : startRecordingAudio(mode);
            };

            const handlePTTStart = (mode) => {
                if (activeMode) return;
                appMode === 'stream' ? startListeningStream(mode) : startRecordingAudio(mode);
            };

            const getButtonEvents = (mode) => {
                if (isPushToTalk) return {
                    onMouseDown: () => handlePTTStart(mode), onMouseUp: stopAll, onMouseLeave: stopAll,
                    onTouchStart: (e) => { e.preventDefault(); handlePTTStart(mode); },
                    onTouchEnd: (e) => { e.preventDefault(); stopAll(); }
                };
                return { onClick: () => handleModeButtonPress(mode) };
            };

            const triggerUpload = (mode) => {
                uploadSenderRef.current = mode;
                if(fileInputRef.current) fileInputRef.current.click();
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const mode = uploadSenderRef.current;
                const tempMsgId = Date.now();
                const senderLabel = mode === 'user' ? 'me' : 'partner';
                const audioUrl = URL.createObjectURL(file);
                const mimeType = normalizeAudioMimeType(file.type, file.name);
                const mimeCandidates = getAudioMimeCandidates(file);
                const audioFilename = file.name || createAudioFilename(senderLabel, tempMsgId, mimeType);

                setMessages(prev => [...prev, { 
                    id: tempMsgId, 
                    text: `匯入處理中... (${file.name})`, 
                    translation: "Gemini 翻譯中...", 
                    sender: senderLabel, 
                    loading: true, 
                    mode: 'import',
                    audioUrl: audioUrl,
                    audioMimeType: mimeType,
                    audioFileName: audioFilename
                }]);
                
                try {
                    const base64Audio = await blobToBase64(file);
                    let result = await processAudioWithGemini(base64Audio, mode, tempMsgId, mimeCandidates);
                    setMessages(prev => prev.map(msg => msg.id === tempMsgId ? { ...msg, text: result.original, translation: result.translation, loading: false } : msg));
                    autoSpeakTranslation(result.translation, senderLabel, tempMsgId);
                } catch (e) {
                    setMessages(prev => prev.map(msg => msg.id === tempMsgId ? { ...msg, text: "錯誤", translation: "匯入音檔解析失敗", loading: false } : msg));
                }
                
                event.target.value = ''; 
            };

            const moveMessage = (index, direction) => {
                setMessages(prev => {
                    const newMsgs = [...prev];
                    if (direction === -1 && index > 0) { 
                        [newMsgs[index - 1], newMsgs[index]] = [newMsgs[index], newMsgs[index - 1]];
                    } else if (direction === 1 && index < newMsgs.length - 1) { 
                        [newMsgs[index], newMsgs[index + 1]] = [newMsgs[index + 1], newMsgs[index]];
                    }
                    return newMsgs;
                });
            };

            const deleteMessage = (id) => {
                const target = messages.find(msg => msg.id === id);
                if (!target) return;
                if (!confirm('確定要刪除此筆翻譯？')) return;

                if (speakingId === id && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    setSpeakingId(null);
                }

                if (target.audioUrl && target.audioUrl.startsWith('blob:')) {
                    try { URL.revokeObjectURL(target.audioUrl); } catch(e) {}
                }

                setMessages(prev => prev.filter(msg => msg.id !== id));
            };

            const formatMessageTime = (msg) => {
                const sourceTime = typeof msg.id === 'number' ? msg.id : Date.now();
                const date = new Date(sourceTime);
                if (Number.isNaN(date.getTime())) return '';
                return date.toLocaleString('zh-TW', { hour12: false });
            };

            const downloadTextFile = (content, filename, mimeType) => {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            };

            const csvEscape = (value) => {
                const text = String(value ?? '');
                return `"${text.replace(/"/g, '""')}"`;
            };

            const exportConversation = (format = 'txt') => {
                if (messages.length === 0) {
                    alert('目前沒有可以匯出的對話紀錄');
                    return;
                }

                const timestamp = formatDateTimeForFilename();
                const languageLabel = SUPPORTED_LANGUAGES[targetLang]?.name || targetLang;

                if (format === 'csv') {
                    const rows = [
                        ['時間', '說話者', '模式', '原文', '譯文', '是否有音檔', '音檔檔名'],
                        ...messages.map(msg => [
                            formatMessageTime(msg),
                            msg.sender === 'me' ? '我（中文）' : `對方（${languageLabel}）`,
                            msg.mode === 'stream' ? '即時' : msg.mode === 'import' ? '匯入音檔' : '錄音',
                            msg.text || '',
                            msg.translation || '',
                            msg.audioUrl ? '是' : '否',
                            msg.audioFileName || ''
                        ])
                    ];
                    const csvContent = '\ufeff' + rows.map(row => row.map(csvEscape).join(',')).join('\n');
                    downloadTextFile(csvContent, `口譯對話紀錄_${timestamp}.csv`, 'text/csv;charset=utf-8');
                    return;
                }

                const lines = [
                    '口譯系統對話紀錄',
                    `匯出時間：${new Date().toLocaleString('zh-TW', { hour12: false })}`,
                    `目前外語：${languageLabel}`,
                    `對話筆數：${messages.length}`,
                    '==================================================',
                    ''
                ];

                messages.forEach((msg, idx) => {
                    const speaker = msg.sender === 'me' ? '我（中文）' : `對方（${languageLabel}）`;
                    const modeLabel = msg.mode === 'stream' ? '即時' : msg.mode === 'import' ? '匯入音檔' : '錄音';
                    lines.push(`[${idx + 1}] ${formatMessageTime(msg)}｜${speaker}｜${modeLabel}`);
                    lines.push(`原文：${msg.text || ''}`);
                    lines.push(`譯文：${msg.translation || ''}`);
                    if (msg.audioUrl) lines.push(`音檔：${msg.audioFileName || '此筆有原始音檔，可在畫面中個別下載。'}`);
                    lines.push('');
                });

                downloadTextFile(lines.join('\n'), `口譯對話紀錄_${timestamp}.txt`, 'text/plain;charset=utf-8');
            };

            // 注意：這個區塊就是之前被截斷的地方，現在已經完整修復了！
            if (!isConfigured) {
                return (
                    <div className="flex flex-col h-screen md:h-auto md:min-h-[560px] max-w-md md:max-w-xl mx-auto bg-slate-900 border-x md:border border-slate-800 shadow-2xl overflow-hidden justify-center items-center p-8 md:p-12 text-slate-200 md:my-8 md:rounded-3xl">
                        <i className="fa-solid fa-key text-6xl text-blue-500 mb-6 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]"></i>
                        <h2 className="text-2xl font-bold mb-3 text-white">啟動系統</h2>
                        <p className="text-sm text-slate-400 text-center mb-8 leading-relaxed">
                            請輸入您的 Google Gemini API Key。<br/>金鑰將安全地記憶在此設備的瀏覽器中，離開網頁不會遺失。
                        </p>
                        <input 
                            type="password" 
                            className="w-full p-4 rounded-xl bg-slate-800 border border-slate-600 text-white mb-6 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-inner"
                            placeholder="AIzaSy..."
                            value={inputKey}
                            onChange={(e) => setInputKey(e.target.value)}
                        />
                        <button 
                            onClick={saveApiKey}
                            className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-4 rounded-xl transition-colors shadow-lg"
                        >
                            連線並開始使用
                        </button>
                    </div>
                );
            }

            const currentPartnerLangConfig = SUPPORTED_LANGUAGES[targetLang];

            return (
                <div className="flex flex-col h-screen md:h-[calc(100vh-32px)] max-w-md md:max-w-5xl lg:max-w-6xl xl:max-w-7xl mx-auto bg-slate-900 border-x md:border border-slate-800 shadow-2xl overflow-hidden relative md:my-4 md:rounded-3xl">
                    <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="audio/*,video/webm,.webm,.m4a,.mp3,.wav,.ogg,.flac,.aac" className="hidden" />

                    <header className="bg-slate-800 p-4 md:px-6 md:py-5 shadow-md z-10 flex justify-between items-center border-b border-slate-700 relative">
                        <div className="flex items-center gap-2">
                            <i className="fa-solid fa-language text-blue-400 text-xl md:text-2xl"></i>
                            <h1 className="font-bold text-lg md:text-2xl text-white whitespace-nowrap">口譯系統</h1>
                            <span className="text-[10px] bg-slate-700/50 text-slate-300 px-2 py-0.5 rounded-full border border-slate-600 ml-1 truncate max-w-[120px]" title={`即時：${FAST_TEXT_MODEL_NAME} / 音訊：${AUDIO_MODEL_NAME}`}>
                                即時:{FAST_TEXT_MODEL_NAME.replace('gemini-', '').replace('-lite', '-lite')}
                            </span>
                        </div>
                        
                        <div className="flex items-center gap-3">
                            <div className="relative">
                                <select 
                                    value={targetLang} 
                                    onChange={(e) => { stopAll(); setTargetLang(e.target.value); }}
                                    className="appearance-none bg-slate-700 text-white text-sm md:text-base py-1 md:py-2 pl-3 md:pl-4 pr-8 md:pr-10 rounded border border-slate-600 focus:outline-none focus:border-blue-500"
                                >
                                    <option value="ja">日本語</option>
                                    <option value="en">English</option>
                                    <option value="ko">한국어</option>
                                    <option value="de">Deutsch</option>
                                    <option value="fr">Français</option>
                                </select>
                                <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-300">
                                    <i className="fa-solid fa-chevron-down text-xs"></i>
                                </div>
                            </div>

                            <button 
                                onClick={() => setAutoPlayTranslation(!autoPlayTranslation)} 
                                className={`text-lg transition-colors flex items-center gap-1 ${autoPlayTranslation ? 'text-yellow-300' : 'text-slate-500 hover:text-slate-300'}`} 
                                title={autoPlayTranslation ? "自動朗讀譯文已開啟" : "點擊開啟自動朗讀譯文"}
                            >
                                <i className={`fa-solid ${autoPlayTranslation ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                            </button>

                            <button 
                                onClick={() => setAutoSaveAudio(!autoSaveAudio)} 
                                className={`text-lg transition-colors flex items-center gap-1 ${autoSaveAudio ? 'text-emerald-400' : 'text-slate-500 hover:text-slate-300'}`} 
                                title={autoSaveAudio ? "自動儲存錄音已開啟" : "點擊開啟自動儲存錄音"}
                            >
                                <i className="fa-solid fa-floppy-disk"></i>
                            </button>

                            <button onClick={resetApiKey} className="text-slate-400 hover:text-slate-200 text-sm transition-colors" title="重設 API Key">
                                <i className="fa-solid fa-gear"></i>
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-4 md:space-y-6 bg-slate-900 pb-8">
                        {messages.length === 0 && !interimText && (
                            <div className="h-full flex flex-col items-center justify-center text-slate-600 space-y-4 opacity-50">
                                <i className={`fa-solid ${appMode === 'stream' ? 'fa-bolt' : 'fa-microphone-lines'} text-6xl mb-2`}></i>
                                <p>目前模式：{appMode === 'stream' ? '即時口譯' : '精準錄音'}</p>
                                <p className="text-sm">{isPushToTalk ? '按住下方按鈕開始對話' : '點擊下方按鈕開始對話'}</p>
                            </div>
                        )}
                        {messages.map((msg, index) => (
                            <div key={msg.id} className={`flex flex-col ${msg.sender === 'me' ? 'items-end' : 'items-start'} message-enter`}>
                                <div className={`max-w-[85%] md:max-w-[72%] rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-lg border relative ${msg.sender === 'me' ? 'bg-blue-600/20 border-blue-500/30 text-blue-100 rounded-br-none' : 'bg-emerald-600/20 border-emerald-500/30 text-emerald-100 rounded-bl-none'}`}>
                                    <span className="absolute top-2 right-2 text-[10px] opacity-40 uppercase tracking-wider border border-white/20 px-1 rounded">{msg.mode === 'stream' ? 'Live' : msg.mode === 'import' ? 'Import' : 'Audio'}</span>
                                    <p className="text-sm opacity-70 mb-1 font-light">{msg.sender === 'me' ? '我 (中文)' : `對方 (${currentPartnerLangConfig.name})`}</p>
                                    
                                    {msg.loading && (msg.mode === 'record' || msg.mode === 'import') ? (
                                        <div className="flex items-center gap-2 mb-2 text-slate-300"><i className="fa-solid fa-circle-notch fa-spin"></i><span className="text-lg italic opacity-70">{msg.mode === 'import' ? '音檔解析中...' : '處理中...'}</span></div>
                                    ) : (<p className="text-lg md:text-xl mb-2 leading-snug">{msg.text}</p>)}
                                    
                                    <div className={`h-px w-full my-2 ${msg.sender === 'me' ? 'bg-blue-500/30' : 'bg-emerald-500/30'}`}></div>
                                    
                                    <div className="flex items-start gap-3 justify-between">
                                        <div className="flex items-start gap-2 flex-1">
                                            <i className={`fa-solid fa-language mt-1 text-xs ${msg.loading ? 'animate-pulse' : ''}`}></i>
                                            <p className={`font-bold text-xl md:text-2xl tracking-wide ${msg.loading ? 'animate-pulse text-slate-400' : 'text-white'}`}>{msg.translation}</p>
                                        </div>
                                        
                                        <div className="flex items-center gap-1">
                                            {index > 0 && (
                                                <button onClick={() => moveMessage(index, -1)} className="p-2 rounded-full text-white/30 hover:text-white hover:bg-white/10 transition-colors flex-shrink-0 mt-[-4px]" title="上移對話">
                                                    <i className="fa-solid fa-arrow-up text-xs"></i>
                                                </button>
                                            )}
                                            {index < messages.length - 1 && (
                                                <button onClick={() => moveMessage(index, 1)} className="p-2 rounded-full text-white/30 hover:text-white hover:bg-white/10 transition-colors flex-shrink-0 mt-[-4px]" title="下移對話">
                                                    <i className="fa-solid fa-arrow-down text-xs"></i>
                                                </button>
                                            )}

                                            {!msg.loading && msg.audioUrl && (
                                                <a href={msg.audioUrl} download={msg.audioFileName || createAudioFilename(msg.sender, msg.id, msg.audioMimeType || 'audio/webm')} className="p-2 rounded-full text-white/40 hover:text-white hover:bg-white/10 transition-colors flex-shrink-0 mt-[-4px]" title="下載原始音檔">
                                                    <i className="fa-solid fa-download"></i>
                                                </a>
                                            )}
                                            {!msg.loading && (
                                                <button 
                                                    onClick={() => speakText(msg.translation, getTtsLangForSender(msg.sender), msg.id, { pauseRecognition: true, resumeMode: activeModeRef.current })} 
                                                    className={`p-2 rounded-full transition-colors flex-shrink-0 mt-[-4px] ${speakingId === msg.id ? 'bg-white text-slate-900 animate-pulse' : 'text-white/40 hover:text-white hover:bg-white/10'}`}
                                                    title="朗讀譯文"
                                                >
                                                    <i className={`fa-solid ${speakingId === msg.id ? 'fa-volume-high' : 'fa-volume-low'}`}></i>
                                                </button>
                                            )}
                                            <button
                                                onClick={() => deleteMessage(msg.id)}
                                                className="p-2 rounded-full text-white/30 hover:text-red-300 hover:bg-red-500/10 transition-colors flex-shrink-0 mt-[-4px]"
                                                title="刪除此筆翻譯"
                                            >
                                                <i className="fa-solid fa-trash-can text-xs"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                        {interimText && (
                             <div className={`flex flex-col ${activeMode === 'user' ? 'items-end' : 'items-start'} opacity-80`}>
                                <div className="max-w-[85%] md:max-w-[72%] rounded-2xl md:rounded-3xl p-4 md:p-6 border border-dashed border-slate-500 bg-slate-800/50">
                                    <p className="text-sm text-slate-400 mb-1">正在聆聽 / 即時暫譯...</p>
                                    <p className="text-lg text-white animate-pulse">{interimText}</p>
                                    {(liveDraftTranslation || liveDraftLoading) && (
                                        <>
                                            <div className="h-px w-full my-2 bg-slate-600/70"></div>
                                            <div className="flex items-start gap-2 text-slate-200">
                                                <i className={`fa-solid fa-bolt mt-1 text-xs ${liveDraftLoading ? 'animate-pulse text-amber-300' : 'text-amber-300'}`}></i>
                                                <p className={`font-bold text-lg md:text-xl ${liveDraftLoading && !liveDraftTranslation ? 'animate-pulse text-slate-400' : 'text-white'}`}>
                                                    {liveDraftTranslation || '暫譯中...'}
                                                </p>
                                            </div>
                                            <p className="text-[10px] text-slate-500 mt-1">暫譯不會自動朗讀，final 後會修正</p>
                                        </>
                                    )}
                                </div>
                             </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="bg-slate-800 p-4 md:px-5 md:py-3 border-t border-slate-700 safe-area-bottom">
                        <div className="flex justify-between items-center mb-4 md:mb-2 px-2">
                            <div className="bg-slate-900 p-1 rounded-lg inline-flex relative">
                                <div className="absolute bg-slate-700 rounded-md transition-all duration-300 ease-out h-[calc(100%-8px)] top-1" style={{width: 'calc(50% - 4px)', left: appMode === 'stream' ? '4px' : 'calc(50%)'}}></div>
                                <button onClick={() => {stopAll(); setAppMode('stream');}} className={`relative z-10 px-4 py-2 text-xs font-medium transition-colors rounded-md flex items-center gap-1 ${appMode === 'stream' ? 'text-white' : 'text-slate-400'}`}><i className="fa-solid fa-bolt"></i>即時</button>
                                <button onClick={() => {stopAll(); setAppMode('record');}} className={`relative z-10 px-4 py-2 text-xs font-medium transition-colors rounded-md flex items-center gap-1 ${appMode === 'record' ? 'text-white' : 'text-slate-400'}`}><i className="fa-solid fa-microphone-lines"></i>錄音</button>
                            </div>
                             <div className="flex items-center">
                                <span className={`text-xs mr-2 font-medium ${isPushToTalk ? 'text-blue-400' : 'text-slate-500'}`}>{isPushToTalk ? '按住說話' : '點擊切換'}</span>
                                <div className={`w-12 h-6 rounded-full p-1 cursor-pointer transition-colors duration-300 flex items-center ${isPushToTalk ? 'bg-blue-600' : 'bg-slate-600'}`} onClick={() => setIsPushToTalk(!isPushToTalk)}>
                                    <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform duration-300 ${isPushToTalk ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4 md:gap-4">
                            <button {...getButtonEvents('user')} disabled={activeMode === 'partner'} className={`relative overflow-hidden rounded-xl md:rounded-2xl p-4 md:py-3 md:px-4 flex flex-col items-center justify-center transition-all duration-100 select-none ${activeMode === 'user' ? (appMode === 'stream' ? 'bg-blue-600 shadow-[0_0_15px_rgba(37,99,235,0.6)] scale-95' : 'bg-red-500 animate-pulse scale-95') : activeMode === 'partner' ? 'bg-slate-700 opacity-30 cursor-not-allowed' : 'bg-slate-700 hover:bg-slate-600 text-slate-200 active:bg-slate-600'} text-white touch-none`}>
                                <div className={`text-2xl md:text-3xl mb-2 md:mb-1 ${activeMode === 'user' && appMode === 'stream' ? 'mic-wave' : ''}`}><i className={`fa-solid ${activeMode === 'user' && appMode === 'record' ? 'fa-stop' : 'fa-microphone'}`}></i></div>
                                <span className="font-bold text-sm md:text-base flex flex-col items-center leading-tight">{activeMode === 'user' && appMode === 'record' ? (isPushToTalk ? '放開傳送' : '停止並傳送') : (isPushToTalk ? <><span className="text-base mb-1">中文</span><span className="text-[10px] font-normal opacity-80">(按住說話)</span></> : '中文')}</span>
                            </button>
                            <button {...getButtonEvents('partner')} disabled={activeMode === 'user'} className={`relative overflow-hidden rounded-xl md:rounded-2xl p-4 md:py-3 md:px-4 flex flex-col items-center justify-center transition-all duration-100 select-none ${activeMode === 'partner' ? (appMode === 'stream' ? 'bg-emerald-600 shadow-[0_0_15px_rgba(5,150,105,0.6)] scale-95' : 'bg-red-500 animate-pulse scale-95') : activeMode === 'user' ? 'bg-slate-700 opacity-30 cursor-not-allowed' : 'bg-slate-700 hover:bg-slate-600 text-slate-200 active:bg-slate-600'} text-white touch-none`}>
                                <div className={`text-2xl md:text-3xl mb-2 md:mb-1 ${activeMode === 'partner' && appMode === 'stream' ? 'mic-wave' : ''}`}><i className={`fa-solid ${activeMode === 'partner' && appMode === 'record' ? 'fa-stop' : 'fa-ear-listen'}`}></i></div>
                                <span className="font-bold text-sm md:text-base flex flex-col items-center leading-tight">{activeMode === 'partner' && appMode === 'record' ? (isPushToTalk ? '放開傳送' : '停止並傳送') : (isPushToTalk ? <><span className="text-base mb-1">{currentPartnerLangConfig.name}</span><span className="text-[10px] font-normal opacity-80">({currentPartnerLangConfig.instruction})</span></> : currentPartnerLangConfig.name)}</span>
                            </button>
                        </div>
                        
                        {activeMode !== null && !isPushToTalk && (
                            <div className="mt-4 md:mt-2 flex justify-center animate-slideIn">
                                <button 
                                    onClick={() => handleCutAndContinue(activeMode)}
                                    title="傳送此段並立刻接續"
                                    className={`w-14 h-14 md:w-11 md:h-11 rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-90 active:-rotate-180 duration-300 text-white text-2xl md:text-xl ${activeMode === 'user' ? 'bg-blue-500 hover:bg-blue-400' : 'bg-emerald-500 hover:bg-emerald-400'}`}
                                >
                                    <i className="fa-solid fa-arrows-rotate"></i>
                                </button>
                            </div>
                        )}
                        
                        <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-3 md:gap-2 mt-4 md:mt-2">
                            <div className="flex flex-wrap gap-3 md:gap-3">
                                <button onClick={() => triggerUpload('user')} className="text-xs text-blue-400 hover:text-blue-300 transition flex items-center gap-1">
                                    <i className="fa-solid fa-file-audio"></i> 匯入中文
                                </button>
                                <button onClick={() => triggerUpload('partner')} className="text-xs text-emerald-400 hover:text-emerald-300 transition flex items-center gap-1">
                                    <i className="fa-solid fa-file-audio"></i> 匯入{currentPartnerLangConfig.name}
                                </button>
                            </div>
                            
                            {messages.length > 0 && (
                                <div className="flex items-center gap-3">
                                    <button onClick={() => exportConversation('txt')} className="text-xs text-amber-300 hover:text-amber-200 transition flex items-center gap-1" title="匯出文字紀錄">
                                        <i className="fa-solid fa-file-lines"></i> TXT
                                    </button>
                                    <button onClick={() => exportConversation('csv')} className="text-xs text-amber-300 hover:text-amber-200 transition flex items-center gap-1" title="匯出 Excel 可開啟的 CSV">
                                        <i className="fa-solid fa-table"></i> CSV
                                    </button>
                                    <button onClick={() => {if(confirm("確定清除紀錄？")) setMessages([]);}} className="text-xs text-slate-500 hover:text-red-400 transition flex items-center gap-1"><i className="fa-solid fa-trash"></i> 清除</button>
                                </div>
                            )}
                        </div>
                        
                        <div className="text-center mt-2 md:mt-1 h-5 md:h-4">
                            <p className="text-xs text-slate-400">{speakingId ? "正在朗讀譯文..." : activeMode ? (appMode === 'record' ? "正在錄音..." : "正在聆聽中...") : (isPushToTalk ? "按住上方按鈕開始" : "點擊上方按鈕開始")}</p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
